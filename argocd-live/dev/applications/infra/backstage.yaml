apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra-services
  source:
    repoURL: https://backstage.github.io/charts
    chart: backstage
    targetRevision: 2.11.0
    helm:
      releaseName: backstage
      valuesObject:
        backstage:
          image:
            registry: ghcr.io
            repository: backstage/backstage
            tag: "1.55.2"
          # Load the image's base app-config.yaml (in-memory SQLite, guest auth); chart ConfigMap is appended last.
          # app-config.production.yaml is skipped on purpose: its `backend.listen: ':7007'` (string) conflicts with
          # the chart's hardcoded APP_CONFIG_backend_listen_port env (object) and crashes the backend on startup.
          args:
            - --config
            - app-config.yaml
          # Demo image; access via: kubectl -n backstage port-forward svc/backstage 7007:7007
          appConfig:
            app:
              baseUrl: http://localhost:7007
            backend:
              baseUrl: http://localhost:7007
              # In-memory SQLite for dev; switch to PostgreSQL once secrets management is in place
              database:
                client: better-sqlite3
                connection: ":memory:"
            auth:
              providers:
                guest:
                  # Image runs with NODE_ENV=production; guest sign-in is disabled there by default
                  dangerouslyAllowOutsideDevelopment: true
            catalog:
              # Base config paths are relative to packages/backend; the image runs from /app
              locations:
                - type: file
                  target: ./examples/entities.yaml
                - type: file
                  target: ./examples/template/template.yaml
                  rules:
                    - allow: [Template]
                - type: file
                  target: ./examples/org.yaml
                  rules:
                    - allow: [User, Group]
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
        postgresql:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: backstage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
