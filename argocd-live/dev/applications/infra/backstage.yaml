apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra-services
  source:
    repoURL: https://backstage.github.io/charts
    chart: backstage
    targetRevision: 2.11.0
    helm:
      releaseName: backstage
      valuesObject:
        backstage:
          image:
            registry: ghcr.io
            repository: backstage/backstage
            tag: "1.55.2"
          # Keep the image's bundled configs (catalog examples, guest auth); chart ConfigMap is appended last
          args:
            - --config
            - app-config.yaml
            - --config
            - app-config.production.yaml
          # Demo image; access via: kubectl -n backstage port-forward svc/backstage 7007:7007
          appConfig:
            app:
              baseUrl: http://localhost:7007
            backend:
              baseUrl: http://localhost:7007
              # In-memory SQLite for dev; switch to PostgreSQL once secrets management is in place
              database:
                client: better-sqlite3
                connection: ":memory:"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
        postgresql:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: backstage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
