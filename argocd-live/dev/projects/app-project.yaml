apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  name: app-services
  namespace: argocd
spec:
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  clusterResourceBlacklist:
  - group: 'kustomize.config.k8s.io'
    kind: 'Kustomization'
  description: backend services project
  destinations:
  - namespace: '*'
    server: '*'
  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'
  namespaceResourceBlacklist:
  - group: 'kustomize.config.k8s.io'
    kind: 'Kustomization'
  sourceRepos:
  - '*'
status: {}

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-services
  namespace: argocd
spec:
  project: app-services
  source:
    repoURL: https://github.com/SerhiiK/cloud-platform-reference.git
    targetRevision: HEAD
    path:
      argocd-live/dev/applications
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
