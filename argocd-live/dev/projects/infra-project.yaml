apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  name: infra-services
  namespace: argocd
spec:
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  description: backend services project
  destinations:
    - namespace: "*"
      server: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  sourceRepos:
    - "*"
status: {}

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-services
  namespace: argocd
spec:
  project: infra-services
  source:
    repoURL: https://github.com/SerhiiK/cloud-platform-reference.git
    targetRevision: main
    path: argocd-live/dev/applications/infra
    directory:
      recurse: true
      exclude: "{**/kustomization.yaml,**/kustomization.yml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
